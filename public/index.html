<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>archivedownloader</title>
  <meta name="description" content="A port of The Ultimate Uzi Archive (uziarchive.top) for any artist's tracker. Every song on the tracker, sorted by era, playable and downloadable with tags.">
  <meta name="theme-color" content="#060607">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="top">
    <a class="mark" href="/" data-link aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v10.5"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/><path d="M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"/></svg>
    </a>
    <a class="brand" href="/" data-link>archivedownloader</a>
    <nav class="artists" id="artists" aria-label="Artists"></nav>
    <section class="add-tracker" id="add-tracker" hidden></section>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="site-foot" id="credits">
    <section class="credits" id="foot-credits"></section>
    <p>This site doesn't host or store any music. It only lists what the tracker lists and links out to it. All music, artwork and trademarks belong to their owners.</p>
    <p class="updated" id="updated"></p>
  </footer>

  <section class="player" id="player" hidden aria-label="Player">
    <div class="player-progress" id="progress" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="player-buffer" id="buffer"></div>
      <div class="player-fill" id="fill"></div>
    </div>
    <div class="player-row">
      <button class="player-now" id="now" type="button" aria-label="Go to song">
        <span class="player-art" id="now-art"></span>
        <span class="player-text">
          <strong id="now-title"></strong>
          <span id="now-sub"></span>
        </span>
      </button>
      <div class="player-controls">
        <button class="icon-btn small hide-sm" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="icon-btn" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8zM5 19V5"/></svg></button>
        <button class="icon-btn play" id="toggle" type="button" aria-label="Play"><svg class="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg></button>
        <button class="icon-btn" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m5 4 10 8-10 8zM19 5v14"/></svg></button>
        <button class="icon-btn small hide-sm" id="repeat" type="button" aria-label="Repeat" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
      <div class="player-side">
        <span class="player-time" id="time">0:00 / 0:00</span>
        <input class="volume hide-sm" id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        <button class="icon-btn small" id="queue-btn" type="button" aria-label="Queue"><svg viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h9M18 14v7l4-3.5z"/></svg></button>
      </div>
    </div>
  </section>

  <aside class="queue" id="queue" hidden aria-label="Queue">
    <div class="queue-head">
      <h2>Up next</h2>
      <button class="text-btn" id="queue-clear" type="button">Clear</button>
      <button class="icon-btn small" id="queue-close" type="button" aria-label="Close queue"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <ol class="queue-list" id="queue-list"></ol>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="none"></audio>

  <script src="/app.js"></script>
</body>
</html>
